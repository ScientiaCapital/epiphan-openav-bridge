# Deployment overlay for the permanent Raspberry Pi 5 room host.
#
# `docker compose up` auto-merges this file with docker-compose.yml (no -f needed).
# It does two deploy-only things the base compose deliberately leaves out:
#   1. Publishes the two microservice ports on the host's LOOPBACK interface only
#      (127.0.0.1), so openav-mcp running on the same host (OPENAV_PEARL_URL :8081 /
#      OPENAV_EC20_URL :8082) can reach them but other machines on the LAN cannot. The
#      URL path of every request carries device credentials, and the services have no
#      auth of their own. The base compose keeps them network-internal (orchestrator
#      reaches them by service name).
#   2. Restarts every service unless explicitly stopped, so the stack returns after a
#      reboot / crash (pair with `sudo systemctl enable docker`).
#
# ARM64 note: the orchestrator image is pinned by digest in docker-compose.yml. If
# `docker buildx imagetools inspect` on that reference shows NO arm64 entry, uncomment the orchestrator `platform:` line below and install
# qemu/binfmt on the Pi (`docker run --privileged tonistiigi/binfmt --install all`).
services:
  orchestrator:
    restart: unless-stopped
    # platform: linux/amd64   # uncomment only if the image is amd64-only (emulated via qemu)

  microservice-epiphan-pearl:
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"

  microservice-epiphan-ec20:
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
