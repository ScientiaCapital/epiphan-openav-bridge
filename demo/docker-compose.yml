services:
  orchestrator:
    # Pinned by digest: resolved from ghcr.io/dartmouth-openav/orchestrator:latest on
    # 2026-11-11 (`docker buildx imagetools inspect ...:latest`; single-arch linux/amd64
    # manifest). To update, re-resolve :latest and replace the digest by hand:
    # .github/dependabot.yml does not watch demo/.
    image: ghcr.io/dartmouth-openav/orchestrator:latest@sha256:6ecc39430dda64aadb6b110e063edc57b09fbff54e8908350ed6f308a18d1c03
    ports:
      # Loopback only: the orchestrator API is unauthenticated control of the room.
      - "127.0.0.1:8080:80"
    environment:
      - ADDRESS_MICROSERVICES_BY_NAME=true
      - SYSTEM_CONFIGURATIONS_VIA_VOLUME=true
      - SYSTEM_CONFIGURATIONS_INSTANT_REFRESH=true
      - DNS_HARD_CACHE=false
      - LOG_ERRORS=true
    volumes:
      - ./system-configs:/system_configurations
      - ./authorization.json:/authorization.json:ro
    networks:
      - openav

  microservice-epiphan-pearl:
    build:
      context: ../openav-epiphan-pearl
      dockerfile: Dockerfile
    networks:
      - openav

  microservice-epiphan-ec20:
    build:
      context: ../openav-epiphan-ec20
      dockerfile: Dockerfile
    networks:
      - openav

networks:
  openav:
    driver: bridge
